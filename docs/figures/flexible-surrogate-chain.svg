<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="850" viewBox="0 0 1560 850" role="img" aria-labelledby="title description">
  <title id="title">Flexible fixed-horizon surrogate chain and one physical endpoint decision</title>
  <desc id="description">Three panels contrast two independently mobile bodies with a rigid pair, show that accepted and rejected inner attempts all count toward a fixed horizon m, and show a fair choice of two singleton bath orders. The auxiliary midpoint can have overlapping cores, although the old and proposed physical endpoints must be hard-valid. The two bath log weights and S old minus S new enter one Metropolis decision. A gray spectator stays fixed.</desc>
  <defs>
    <style>
      text { font-family: "DejaVu Sans", sans-serif; fill: #152b3a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 18px; fill: #516475; }
      .panel-title { font-size: 22px; font-weight: 700; }
      .body { font-size: 18px; }
      .small { font-size: 16px; fill: #516475; }
      .tiny { font-size: 14px; fill: #516475; }
      .bold { font-weight: 700; }
      .center { text-anchor: middle; }
      .panel { fill: #ffffff; stroke: #d5dfe6; stroke-width: 1.5; }
      .a { fill: #b8e5f0; stroke: #187c99; stroke-width: 2.5; }
      .b { fill: #ffdfb8; stroke: #b87321; stroke-width: 2.5; }
      .spectator { fill: #dce2e7; stroke: #657785; stroke-width: 2; }
      .body-letter { font-size: 19px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .mini-letter { font-size: 13px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
      .flow { fill: none; stroke: #60788a; stroke-width: 2.4; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#60788a"/>
    </marker>
    <marker id="arrow-a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#187c99"/>
    </marker>
    <marker id="arrow-b" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b87321"/>
    </marker>
  </defs>

  <rect width="1560" height="850" fill="#f4f7fa"/>
  <text x="40" y="53" class="title">Flexible surrogate chain</text>
  <text x="40" y="86" class="subtitle">Two mobile bodies, a fixed environment, one physical endpoint decision.</text>
  <circle cx="51" cy="123" r="9" class="a"/>
  <text x="70" y="129" class="small">mobile A</text>
  <circle cx="188" cy="123" r="9" class="b"/>
  <text x="207" y="129" class="small">mobile B</text>
  <circle cx="325" cy="123" r="9" class="spectator"/>
  <text x="344" y="129" class="small">fixed spectator S</text>
  <text x="1520" y="129" class="small" text-anchor="end">Schematic only · no simulation data</text>

  <!-- Panel 1: degrees of freedom. Arrows show allowed motions, not simultaneous updates. -->
  <rect x="40" y="161" width="450" height="586" rx="18" class="panel"/>
  <text x="65" y="201" class="panel-title">1  Flexible vs. rigid</text>
  <text x="65" y="235" class="body">Flexible: both poses may change.</text>
  <text x="65" y="262" class="small">Only one body moves in each inner attempt.</text>
  <rect x="65" y="286" width="400" height="192" rx="12" fill="#f5fafc"/>
  <circle cx="151" cy="353" r="29" class="a"/>
  <path d="M 151 326 L 160 315" stroke="#187c99" stroke-width="4" stroke-linecap="round"/>
  <text x="151" y="353" class="body-letter">A</text>
  <path d="M 113 347 Q 99 313 127 301" fill="none" stroke="#187c99" stroke-width="2.7" marker-end="url(#arrow-a)"/>
  <path d="M 190 354 L 220 337" fill="none" stroke="#187c99" stroke-width="2.7" marker-end="url(#arrow-a)"/>
  <circle cx="369" cy="362" r="29" class="b"/>
  <path d="M 395 372 L 408 377" stroke="#b87321" stroke-width="4" stroke-linecap="round"/>
  <text x="369" y="362" class="body-letter">B</text>
  <path d="M 342 322 Q 373 306 399 324" fill="none" stroke="#b87321" stroke-width="2.7" marker-end="url(#arrow-b)"/>
  <path d="M 370 402 L 351 431" fill="none" stroke="#b87321" stroke-width="2.7" marker-end="url(#arrow-b)"/>
  <circle cx="255" cy="418" r="22" class="spectator"/>
  <text x="255" y="418" class="body-letter">S</text>
  <text x="255" y="460" class="small center">spectator stays fixed</text>
  <text x="65" y="518" class="body bold">Rigid reference</text>
  <rect x="65" y="540" width="400" height="127" rx="12" fill="#f7f8fa"/>
  <line x1="162" y1="591" x2="363" y2="591" stroke="#82929e" stroke-width="8" stroke-linecap="round"/>
  <circle cx="162" cy="591" r="25" class="a"/>
  <path d="M 162 568 L 169 557" stroke="#187c99" stroke-width="4" stroke-linecap="round"/>
  <text x="162" y="591" class="body-letter">A</text>
  <circle cx="363" cy="591" r="25" class="b"/>
  <path d="M 386 599 L 398 603" stroke="#b87321" stroke-width="4" stroke-linecap="round"/>
  <text x="363" y="591" class="body-letter">B</text>
  <text x="265" y="647" class="small center">relative position + orientation fixed</text>
  <text x="65" y="707" class="small">Flexible motion can change internal overlap.</text>

  <!-- Panel 2: illustrative counted attempts, including residence after rejection. -->
  <rect x="510" y="161" width="450" height="586" rx="18" class="panel"/>
  <text x="535" y="201" class="panel-title">2  Exactly m attempts</text>
  <text x="535" y="235" class="body">Fresh fair choice: A or B (½ each).</text>
  <rect x="535" y="258" width="400" height="69" rx="10" fill="#eef4f7"/>
  <text x="552" y="285" class="small">Fixed throughout: cloud, spectators,</text>
  <text x="552" y="310" class="small">proposal scales and score function S.</text>
  <text x="535" y="361" class="small">Example of counted attempts</text>
  <rect x="548" y="380" width="374" height="57" rx="10" fill="#eff8f3" stroke="#b5d9c3"/>
  <circle cx="575" cy="408" r="17" fill="#d5ecdf"/>
  <text x="575" y="414" class="body bold center">1</text>
  <text x="611" y="414" class="body bold">accepted</text>
  <text x="903" y="414" class="small" text-anchor="end">advance</text>
  <path d="M 735 439 L 735 459" class="flow"/>
  <rect x="548" y="467" width="374" height="57" rx="10" fill="#fff7ed" stroke="#ebd0ae"/>
  <circle cx="575" cy="495" r="17" fill="#f9e6cc"/>
  <text x="575" y="501" class="body bold center">2</text>
  <text x="611" y="501" class="body bold">hard reject</text>
  <text x="903" y="501" class="small" text-anchor="end">keep state</text>
  <path d="M 735 526 L 735 546" class="flow"/>
  <rect x="548" y="554" width="374" height="57" rx="10" fill="#f5f2fa" stroke="#d7cce9"/>
  <circle cx="575" cy="582" r="17" fill="#e7def2"/>
  <text x="575" y="588" class="body bold center">3</text>
  <text x="611" y="588" class="body bold">MH reject</text>
  <text x="903" y="588" class="small" text-anchor="end">keep state</text>
  <text x="735" y="643" class="small center">⋮  continue through attempt m</text>
  <rect x="548" y="665" width="374" height="50" rx="10" fill="#e9f2f8" stroke="#b6cede"/>
  <text x="735" y="697" class="body bold center">Endpoint y after m attempts</text>

  <!-- Panel 3: both endpoints are valid; either copied midpoint can have core overlap. -->
  <rect x="980" y="161" width="540" height="586" rx="18" class="panel"/>
  <text x="1005" y="201" class="panel-title">3  One physical endpoint gate</text>
  <text x="1005" y="235" class="body">Fair order coin; two singleton bath legs.</text>
  <text x="1250" y="272" class="small center">A then B · ½</text>
  <text x="1250" y="454" class="small center">B then A · ½</text>
  <path d="M 1109 398 C 1142 398 1153 335 1194 335" class="flow"/>
  <path d="M 1305 335 C 1348 335 1353 398 1388 398" class="flow"/>
  <path d="M 1109 424 C 1142 424 1153 515 1194 515" class="flow"/>
  <path d="M 1305 515 C 1348 515 1353 424 1388 424" class="flow"/>
  <text x="1055" y="354" class="body bold center">old x₀</text>
  <rect x="1002" y="372" width="106" height="101" rx="10" fill="#f5fafc" stroke="#c6d6df"/>
  <circle cx="1034" cy="408" r="15" class="a"/>
  <text x="1034" y="408" class="mini-letter">A</text>
  <circle cx="1075" cy="408" r="15" class="b"/>
  <text x="1075" y="408" class="mini-letter">B</text>
  <circle cx="1055" cy="448" r="11" class="spectator"/>
  <text x="1055" y="448" class="mini-letter">S</text>
  <text x="1055" y="498" class="small center">hard-valid</text>
  <text x="1443" y="354" class="body bold center">endpoint y</text>
  <rect x="1390" y="372" width="106" height="101" rx="10" fill="#f5fafc" stroke="#c6d6df"/>
  <circle cx="1422" cy="408" r="15" class="b"/>
  <text x="1422" y="408" class="mini-letter">B</text>
  <circle cx="1463" cy="408" r="15" class="a"/>
  <text x="1463" y="408" class="mini-letter">A</text>
  <circle cx="1443" cy="448" r="11" class="spectator"/>
  <text x="1443" y="448" class="mini-letter">S</text>
  <text x="1443" y="498" class="small center">hard-valid</text>
  <rect x="1197" y="289" width="106" height="101" rx="10" fill="#fff8f0" stroke="#dcbf99"/>
  <!-- Both copied poses occupy the old B position; split color shows coincident cores. -->
  <path d="M 1270 307 A 18 18 0 0 0 1270 343 Z" class="a"/>
  <path d="M 1270 307 A 18 18 0 0 1 1270 343 Z" class="b"/>
  <text x="1262" y="325" class="mini-letter">A</text>
  <text x="1278" y="325" class="mini-letter">B</text>
  <circle cx="1250" cy="365" r="11" class="spectator"/>
  <text x="1250" y="365" class="mini-letter">S</text>
  <rect x="1197" y="471" width="106" height="101" rx="10" fill="#fff8f0" stroke="#dcbf99"/>
  <!-- Reverse order copies both poses onto the old A position. -->
  <path d="M 1229 489 A 18 18 0 0 0 1229 525 Z" class="b"/>
  <path d="M 1229 489 A 18 18 0 0 1 1229 525 Z" class="a"/>
  <text x="1221" y="507" class="mini-letter">B</text>
  <text x="1237" y="507" class="mini-letter">A</text>
  <circle cx="1250" cy="547" r="11" class="spectator"/>
  <text x="1250" y="547" class="mini-letter">S</text>
  <text x="1250" y="602" class="body bold center">Auxiliary midpoint may overlap cores.</text>
  <text x="1250" y="627" class="small center">No hard filter on this copied midpoint.</text>
  <rect x="1005" y="645" width="490" height="78" rx="11" fill="#e9f2f8" stroke="#b6cede"/>
  <text x="1250" y="675" class="body center">log ratio = log w₁ + log w₂ + S<tspan baseline-shift="sub" font-size="12">old</tspan> − S<tspan baseline-shift="sub" font-size="12">new</tspan></text>
  <text x="1250" y="703" class="body bold center">ONE MH decision: accept y or keep x₀</text>

  <text x="40" y="793" class="body bold">Rejected inner attempts count toward m.</text>
  <text x="40" y="822" class="subtitle">The auxiliary bath path supplies a weight; its midpoint is not a physical chain state.</text>
</svg>
